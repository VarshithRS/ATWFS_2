# =============================================================================
# Central configuration
# =============================================================================
seed: 42

paths:
  data_root: "C:/data/idd_converted"
  output_dir: ./outputs
  checkpoint_dir: ./outputs/checkpoints
  report_dir: ./outputs/reports

data:
  image_size: [256, 256]
  num_workers: 2
  image_suffix: _leftImg8bit.png
  mask_suffix: _gtFine_labellevel3Ids.png
  ignore_label: 255

  # IDD level-3 hierarchy
  # 0 = road
  # 1 = parking + drivable fallback
  # 3 = sidewalk/non-drivable
  drivable_level3_ids: [0, 1]

  obstacle_level3_ids: [4, 5, 6, 7, 8, 9, 10, 11, 12]

  expected_split_sizes: {train: 6993, val: 981, test: 2029}

  eval_split: val

  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

terrain:
  classes: [paved, unpaved, vegetation, water_or_other]

augmentation:
  standard:
    enabled: true
    hflip_p: 0.5
    crop_p: 0.5
    crop_scale: [0.6, 1.0]
    jitter_p: 0.8
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.03

  synthetic:
    enabled: false
    fog:              {enabled: true, p: 0.25, max_density: 0.7}
    motion_blur:      {enabled: true, p: 0.25, max_kernel: 15}
    water_reflection: {enabled: true, p: 0.25, strength: 0.5}
    dust:             {enabled: true, p: 0.25, max_density: 0.5}

model:
  encoder: mobilenet_v3_large
  pretrained: true
  decoder_channels: [128, 64, 40, 24]
  gn_max_groups: 8
  seg_classes: 2
  terrain_classes: 4
  terrain_hidden: 64
  terrain_dropout: 0.2

student:
  encoder: mobilenet_v3_small
  pretrained: true
  decoder_channels: [64, 32, 24, 16]
  gn_max_groups: 8
  seg_classes: 2
  terrain_classes: 4
  terrain_hidden: 32
  terrain_dropout: 0.2

loss:
  dice_weight: 1.0
  boundary: {w0: 5.0, sigma: 5.0}
  aux_weight: 0.4
  evidential_kl_anneal_epochs: 10
  evidence_clip: 1000.0
  terrain_ignore_index: -1

train:
  epochs: 50
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0
  amp: true
  log_every: 20
  ece_bins: 15

distill:
  epochs: 30
  temperature: 2.0
  lambda_distill: 1.0
  w_seg: 1.0
  w_conf: 1.0
  w_terrain: 0.5
  teacher_checkpoint: ./outputs/checkpoints/teacher_best.pt

compression:
  prune_amount: 0.3
  prune_finetune_epochs: 0
  ptq_calibration_batches: 4
  fps_warmup: 3
  fps_iters: 10
  cpu_threads: 0

classical:
  seed_region: {top: 0.72, bottom: 0.98, half_width_top: 0.12, half_width_bottom: 0.30}
  color_k: 2.5
  canny: [60, 160]
  edge_dilate: 2
  morph_kernel: 7
  horizon_frac: 0.25

consistency:
  geometric:
    area_frac_range: [0.05, 0.85]
    weights: {area: 0.2, solidity: 0.25, perspective: 0.25, connectivity: 0.2, bottom_touch: 0.1}

  temporal:
    expected_shift_per_mps: 0.02
    base_shift: 0.01
    tau: 0.05
    dt: 1.0

fusion:
  gain: 8.0
  w_certainty: 0.5
  w_geometric: 0.25
  w_temporal: 0.25
  bias: -0.5
  terrain_penalty: [0.0, 0.1, 0.3, 0.5]
  hidden: 16
  fallback_threshold: 0.5
  mask_threshold: 0.5
  train_csv: ./outputs/fusion_training_data.csv

inference:
  checkpoint: ./outputs/checkpoints/student_best.pt
  frame_skip: 1
  queue_size: 8
  speed_mps_input: 1.0
  display: false
  video_fourcc: mp4v

  detector:
    backend: yolov8n
    weights: yolov8n.pt
    conf: 0.35
    class_ids: [0, 1, 2, 3, 5, 7]

  decision:
    max_steer_deg: 30.0
    v_max: 1.5
    trust_min: 0.3
    width_ref: 0.35
    lookahead_rows: [0.55, 0.9]
    prox_slow: 0.55
    prox_stop: 0.85
    corridor_half_width: 0.2
    terrain_speed_factor: [1.0, 0.7, 0.5, 0.3]
    obstacle_dilate_px: 6

evaluation:
  low_miou_thr: 0.6
  good_iou_thr: 0.9
  boundary_band_px: 5
  boundary_frac_thr: 0.6
  missed_obstacle_frac_thr: 0.2
  min_obstacle_px: 30
  max_saved_failures: 50

smoke:
  image_size: [96, 96]
  num_train: 32
  num_val: 8
  batch_size: 8
  epochs: 2
  pretrained: false
  video_frames: 12
  video_size: [160, 120]